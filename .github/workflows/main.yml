name: Compilar APK AlgoFin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: AlgoFin   # o código do aplicativo fica nesta pasta

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Conferir os cálculos do aplicativo contra a referência exata
        working-directory: .
        run: python -m unittest discover -s conferencia -p "test_*.py" -v

      - name: Instalar ferramentas do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool libtool-bin autoconf automake git python3-dev ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev libffi-dev unzip zip

      - name: Instalar Buildozer
        run: pip install buildozer cython==0.29.33 virtualenv

      - name: Gerar o APK
        run: yes | buildozer -v android debug

      - name: Disponibilizar o APK para download
        uses: actions/upload-artifact@v4
        with:
          name: AlgoFin-APK
          path: AlgoFin/bin/*.apk
